server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so client-side
    # routing (if added later) keeps working on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # In production, point this at the backend's internal service name
    # (e.g. an App Runner / Cloud Run URL) rather than localhost.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
