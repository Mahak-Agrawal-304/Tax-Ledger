version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tax_user
      POSTGRES_PASSWORD: tax_pass
      POSTGRES_DB: tax_calculator
    volumes:
      - tax_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://tax_user:tax_pass@db:5432/tax_calculator
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  tax_db_data:
